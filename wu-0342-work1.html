<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
        table{
            border-collapse: collapse;
            width: 100%;
        }
        td{
            border: 2px solid #000;
            padding:15px;
            vertical-align: top;
        }
        .title{
            text-align:center;
            font-size:22px;
            border:none;
        }
        .sign{
            text-align:right;
            border:none;
            font-size:18px;
        }
    </style>
</head>
<body>
<table>
    <!-- 标题行 -->
    <tr>
        <td colspan="3" class="title">我的个人主页</td>
    </tr>
    <tr>
        <td colspan="3" class="title">自我介绍</td>
    </tr>
    <!-- 姓名、专业、爱好 -->
    <tr>
        <td>姓名：</td>
        <td>专业：</td>
        <td>爱好：</td>
    </tr>
    <!-- 照片区域和自我介绍文本区域 -->
    <tr>
        <td colspan="1">照片</td>
        <td colspan="2">
            这里填写自我介绍文字<br>
            可以写你的性格、经历、特长等内容
        </td>
    </tr>
    <!-- 底部签名 -->
    <tr>
        <td colspan="3" class="sign">底部签名</td>
    </tr>
</table>
</body>
</html>
