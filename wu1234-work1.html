<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            padding: 40px 20px;
        }
        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 12px;
        }
        .line {
            border-bottom: 3px solid #000;
            margin-bottom: 60px;
        }
        .avatar-tip {
            text-align: center;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .intro-tip {
            text-align: center;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .signature {
            text-align: right;
            font-size: 22px;
            margin-top: 80px;
            padding-right: 40px;
        }
    </style>
</head>
<body>
    <div class="title">我的个人主页</div>
    <div class="line"></div>

    <div class="avatar-tip">放个人头像</div>
    <div class="line"></div>

    <div class="intro-tip">自我介绍</div>
    <div class="line"></div>

    <div class="signature">底部署名</div>
</body>
</html>
